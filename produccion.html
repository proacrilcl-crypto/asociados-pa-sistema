<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#253d65">
  <title>AcrilGrup · Producción</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--navy:#253d65;--gold:#bf8a4c;--bg:#f1f5f9;--ok:#168653;--bad:#c93838;--line:#d8e1eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033}button,input,select{font:inherit}.wrap{max-width:640px;margin:auto;min-height:100vh}.head{padding:22px 18px 32px;color:#fff;background:linear-gradient(135deg,var(--navy),#385f94);border-radius:0 0 25px 25px}.head h1{margin:0;font-size:23px}.head p{margin:5px 0 0;color:#dce8f7;font-size:13px}.logout{float:right;background:transparent;border:1px solid #ffffff80}.main{padding:16px;margin-top:-13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 8px 24px #253d6512}.hidden{display:none!important}label{display:block;font-size:12px;font-weight:850;color:#475569;margin:13px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff}button{border:0;border-radius:12px;padding:13px 15px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer}button.secondary{background:#edf2f8;color:var(--navy)}button.danger{background:var(--bad)}.row{display:grid;grid-template-columns:1fr auto;gap:9px}.actions{display:flex;gap:9px;margin-top:13px}.actions button{flex:1}.status{padding:12px;border-radius:12px;margin-top:12px;font-weight:750;font-size:13px}.status.info{background:#eaf2fc;color:#214d80}.status.ok{background:#e7f7ef;color:#126b43}.status.bad{background:#ffeded;color:#a92525}#reader{overflow:hidden;border-radius:14px;margin-top:12px}.mode{border:2px solid #dbe4ef;border-radius:15px;padding:13px;margin-top:12px}.result{border-left:5px solid var(--ok)}.result h2{margin:0 0 8px;color:var(--ok)}.big{font-size:25px;font-weight:950;color:var(--navy)}.flow{font-weight:900;font-size:17px;margin:10px 0}.history{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.history-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:12px}.fine{font-size:11px;color:var(--muted);line-height:1.5}@media(max-width:440px){.row{grid-template-columns:1fr}.row button{width:100%}}
  </style>
</head>
<body><div class="wrap"><header class="head"><button id="logoutBtn" class="logout hidden">Salir</button><h1>AcrilGrup Producción</h1><p>Actualización rápida de estados por QR</p></header><main class="main">
  <section id="loginCard" class="card"><h2>Ingreso de producción</h2><label>Correo</label><input id="email" type="email" autocomplete="username"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" style="width:100%;margin-top:16px">Ingresar</button><div id="loginStatus"></div></section>
  <section id="scanCard" class="card hidden"><h2 style="margin-top:0">Estación de escaneo</h2><div class="mode"><label style="margin-top:0">Modo de trabajo</label><select id="mode"><option value="produccion">Producción: iniciar o completar fabricación</option><option value="retiro">Retiro: entregar pedido al cliente</option><option value="consulta">Consulta: ver estado sin modificar</option></select><p id="modeHelp" class="fine"></p></div><label>Número de orden</label><div class="row"><input id="manualOrder" inputmode="numeric" placeholder="Ej.: 254"><button id="findBtn">Procesar</button></div><div class="actions"><button id="scanBtn" class="secondary">Abrir cámara</button><button id="stopBtn" class="danger hidden">Cerrar cámara</button></div><div id="reader" class="hidden"></div><div id="scanStatus"></div></section>
  <section id="resultCard" class="card result hidden"><h2 id="resultTitle">Estado actualizado ✓</h2><div id="resultOrder" class="big"></div><div id="resultClient"></div><div id="resultFlow" class="flow"></div><div id="resultDetail" class="fine"></div><button id="nextBtn" style="width:100%;margin-top:14px">Escanear siguiente</button></section>
  <section id="historyCard" class="card hidden"><h3 style="margin-top:0">Escaneos de esta sesión</h3><div id="history"></div></section>
</main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,query,where,limit,getDocs,doc,runTransaction}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC1-ZVy_aFu9jMWyVosbDNF7VQyglR0QU4",authDomain:"asociados-pa-sistema-7c8a6.firebaseapp.com",projectId:"asociados-pa-sistema-7c8a6",storageBucket:"asociados-pa-sistema-7c8a6.appspot.com",messagingSenderId:"636245928794",appId:"1:636245928794:web:eaa72dad744de198c06163"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);let user=null,scanner=null,busy=false;const session=[],$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function status(id,msg,type='info'){const e=$(id);e.className=msg?`status ${type}`:'';e.textContent=msg||''}function showAuth(ok){$('loginCard').classList.toggle('hidden',ok);$('scanCard').classList.toggle('hidden',!ok);$('logoutBtn').classList.toggle('hidden',!ok)}onAuthStateChanged(auth,u=>{user=u;showAuth(!!u)});$('loginBtn').onclick=async()=>{status('loginStatus','Ingresando...');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);status('loginStatus','')}catch{status('loginStatus','Correo o contraseña incorrectos.','bad')}};$('logoutBtn').onclick=async()=>{await stopScanner();await signOut(auth)};
function parseCode(raw){const m=String(raw||'').match(/(?:AG-ORDER:)?(\d+)/i);return m?Number(m[1]):0}function transition(p,mode){const state=p.estado||'';if(mode==='consulta')return{next:state,write:false,label:'Consulta realizada'};if(mode==='produccion'){if(['Agendado','En diseño'].includes(state))return{next:'En producción',write:true,label:'Fabricación iniciada'};if(state==='En producción')return{next:'Completado',write:true,label:'Fabricación completada'};if(state==='Completado')return{error:p.tipoEntrega==='Retiro'?'El pedido está listo. Usa el modo Retiro cuando el cliente lo reciba.':'El pedido está listo y espera el escaneo del repartidor.'};return{error:`No se puede procesar en producción desde el estado “${state}”.`}}if(mode==='retiro'){if(p.tipoEntrega!=='Retiro')return{error:'Esta orden corresponde a despacho, no a retiro.'};if(state!=='Completado')return{error:`Solo se puede retirar una orden Completada. Estado actual: “${state}”.`};return{next:'Retirado',write:true,label:'Pedido retirado por el cliente'}}return{error:'Modo no válido.'}}
async function processOrder(n){if(busy||!user)return;if(!n){status('scanStatus','Escanea o escribe un número válido.','bad');return}busy=true;status('scanStatus','Procesando orden...');try{const qSnap=await getDocs(query(collection(db,'pedidos'),where('numeroPedido','==',Number(n)),limit(1)));if(qSnap.empty)throw new Error('No se encontró esa orden.');const item=qSnap.docs[0],refDoc=doc(db,'pedidos',item.id),mode=$('mode').value;let outcome=null,pedido=null;await runTransaction(db,async tx=>{const snap=await tx.get(refDoc);if(!snap.exists())throw new Error('La orden ya no existe.');pedido={id:snap.id,...snap.data()};outcome=transition(pedido,mode);if(outcome.error)throw new Error(outcome.error);if(outcome.write){const movement={tipo:'estado_produccion',fecha:new Date().toISOString(),usuarioUid:user.uid,usuarioEmail:user.email||'',estadoAnterior:pedido.estado,estadoNuevo:outcome.next};tx.update(refDoc,{estado:outcome.next,ultimaActualizacionEstado:new Date().toISOString(),actualizadoPor:user.email||user.uid,movimientos:[...(Array.isArray(pedido.movimientos)?pedido.movimientos:[]),movement]})}});showResult(pedido,outcome);status('scanStatus','');if(outcome.write)session.unshift({numero:pedido.numeroPedido,cliente:pedido.cliente,from:pedido.estado,to:outcome.next,time:new Date()});renderHistory()}catch(e){status('scanStatus',e.message||'No se pudo actualizar la orden.','bad')}finally{busy=false}}
function showResult(p,o){$('resultTitle').textContent=o.write?'Estado actualizado ✓':'Consulta de orden';$('resultOrder').textContent=`Orden N.º ${String(p.numeroPedido).padStart(3,'0')}`;$('resultClient').textContent=p.cliente||'Cliente no registrado';$('resultFlow').textContent=o.write?`${p.estado} → ${o.next}`:`Estado: ${p.estado}`;$('resultDetail').textContent=`${o.label}. ${p.tipoEntrega==='Retiro'?'Retiro en tienda':'Despacho con repartidor'}.`;$('resultCard').classList.remove('hidden');$('resultCard').scrollIntoView({behavior:'smooth'})}function renderHistory(){$('historyCard').classList.toggle('hidden',!session.length);$('history').innerHTML=session.slice(0,12).map(x=>`<div class="history-row"><span><strong>OT ${esc(x.numero)}</strong> · ${esc(x.cliente)}</span><span>${esc(x.from)} → ${esc(x.to)}</span></div>`).join('')}
$('findBtn').onclick=()=>processOrder(parseCode($('manualOrder').value));$('manualOrder').addEventListener('keydown',e=>{if(e.key==='Enter')processOrder(parseCode(e.target.value))});async function startScanner(){if(scanner)return;$('reader').classList.remove('hidden');$('stopBtn').classList.remove('hidden');try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async text=>{const n=parseCode(text);if(!n||busy)return;await stopScanner();$('manualOrder').value=n;processOrder(n)},()=>{})}catch{scanner=null;status('scanStatus','No se pudo abrir la cámara. Autoriza el permiso o escribe el número.','bad')}}async function stopScanner(){if(scanner){try{await scanner.stop();await scanner.clear()}catch{}scanner=null}$('reader').classList.add('hidden');$('stopBtn').classList.add('hidden')}$('scanBtn').onclick=startScanner;$('stopBtn').onclick=stopScanner;$('nextBtn').onclick=()=>{$('resultCard').classList.add('hidden');$('manualOrder').value='';$('manualOrder').focus()};function modeHelp(){const m=$('mode').value;$('modeHelp').textContent=m==='produccion'?'Primer escaneo: Agendado → En producción. Segundo escaneo: En producción → Completado.':m==='retiro'?'Una orden Completada y marcada como Retiro pasará a Retirado.':'Muestra la información sin cambiar el estado.'}$('mode').onchange=modeHelp;modeHelp();
</script></body></html>
